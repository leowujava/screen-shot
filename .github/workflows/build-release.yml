name: Build & Release

on:
  push:
    branches: [master, main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest -q

  build:
    name: Build & Release
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt pyinstaller

      - name: Build executable
        run: pyinstaller screen-shot.spec --noconfirm --clean

      - name: Generate checksum
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/screen-shot.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  screen-shot.exe" | Set-Content dist/screen-shot.exe.sha256 -Encoding ascii
          Get-Content dist/screen-shot.exe.sha256

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: screen-shot-windows-x64
          path: |
            dist/screen-shot.exe
            dist/screen-shot.exe.sha256
          if-no-files-found: error
          retention-days: 30

      # 分支推送（含手动触发）：更新滚动预发布 latest
      - name: Publish rolling pre-release
        if: startsWith(github.ref, 'refs/heads/')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build (${{ github.run_number }})
          body: |
            自动构建自 `${{ github.sha }}`（${{ github.ref_name }} 分支）。

            - 提交信息：${{ github.event.head_commit.message }}
            - 构建日志：${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          prerelease: true
          make_latest: "false"
          fail_on_unmatched_files: true
          files: |
            dist/screen-shot.exe
            dist/screen-shot.exe.sha256

      # 打 v* 标签：发布正式版本
      - name: Publish release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          fail_on_unmatched_files: true
          files: |
            dist/screen-shot.exe
            dist/screen-shot.exe.sha256
